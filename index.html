<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CH+ Partners — Brilliant design. Simplicity at scale.</title>
  <meta name="description" content="Scroll to fly through a CH+ Partners home." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root, .sw-root {
      --sw-bg: #14110D;
      --sw-ink: #F2EAD8;
      --sw-ink-soft: #B9AC94;
      --sw-accent: #C9A24B;
    }
    html, body { margin: 0; background: #14110D; }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'CH+ Partners', href: '#top' },
      cta: { label: 'Get in touch', href: '#' },
      hint: 'scroll to walk in',
      diveScroll: 1.3,
      connScroll: 0.9,
      eagerLoad: true,
      sections: [
        {
          id: 'entrance', label: 'Arrival',
          still: 'assets/stills/entrance.jpg',
          clip: 'assets/vid/entrance.mp4',
          accent: '#C9A24B',
          scroll: 1.6, linger: 0.4,
          // The brand mark appears burned into the door itself as it swings open
          // (door cracks ~t=0.8s, fully open ~t=2s of this 8s clip) and dissolves
          // before the camera passes through into the hallway. x/y are fractions of
          // the 1280x720 source frame — mapped through the same object-fit:cover math
          // as the video itself (see srcToScreen in scrub-engine.js), so it stays
          // anchored to the door regardless of viewport aspect ratio.
          // Now keyed to appear only once the door is fully open (t≈2s/0.25 of this 8s
          // clip), then holds and grows through the hallway push, dissolving well before
          // the seam into the living room.
          doorText: { text: 'CH+ Partners', from: 0.30, to: 0.70, x: 0.50, y: 0.40, srcFontPx: 100, zoom: 0.28 },
          eyebrow: 'Hyderabad · Bespoke residential design',
          title: 'Brilliant design. Simplicity at scale.',
          body: 'Step into a home considered down to the last detail.',
          tags: ['Jali & brass', 'Makrana marble'],
        },
        {
          id: 'living', label: 'Living',
          still: 'assets/stills/living.jpg',
          clip: 'assets/vid/living.mp4',
          accent: '#C9A24B',
          eyebrow: 'The living room',
          title: 'Space that breathes.',
          body: 'Teak, brass and light, arranged with restraint.',
          tags: ['Teak joinery', 'Jharokha lighting'],
        },
        {
          id: 'kitchen', label: 'The Kitchen',
          still: 'assets/stills/kitchen.jpg',
          clip: 'assets/vid/kitchen.mp4',
          accent: '#C9A24B',
          scroll: 1.7, linger: 0.5,
          // No side-panel copy here on purpose — the payoff is the handwritten note
          // itself. Real, clickable text is positioned to sit exactly where the
          // video's baked-in handwriting is: coordinates are fractions of the
          // 1280x720 source frame, measured directly off the rendered clip's last
          // frame (title bbox ~x430-930/y330-410px, subtext line ~y475-520px), then
          // mapped through the same object-fit:cover math the video itself uses.
          noteOverlay: {
            from: 0.78,
            title: "Let's design yours.",
            titleX: 0.531, titleY: 0.514, titleSrcFontPx: 82,
            linksX: 0.531, linksY: 0.68, linksSrcFontPx: 25,
            links: [
              { label: 'ch+partners@gmail.com', href: 'mailto:ch+partners@gmail.com' },
              { label: '+91 99089 16178', href: 'https://wa.me/919908916178' },
            ],
          },
        },
      ],
      connectors: [],
    });
  </script>
</body>
</html>
