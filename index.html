<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CH+ Partners — Brilliant design. Simplicity at scale.</title>
  <meta name="description" content="Scroll to fly through a CH+ Partners home." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root, .sw-root {
      --sw-bg: #14110D;
      --sw-ink: #F2EAD8;
      --sw-ink-soft: #B9AC94;
      --sw-accent: #C9A24B;
    }
    html, body { margin: 0; background: #14110D; }
  </style>
</head>
<body>
  <div id="top"></div>
  <div id="world"></div>

  <script src="scrub-engine.js"></script>
  <script>
    mountScrollWorld(document.getElementById('world'), {
      brand: { name: 'CH+ Partners', href: '#top' },
      cta: { label: 'Get in touch', href: '#' },
      hint: 'scroll to walk in',
      diveScroll: 1.3,
      connScroll: 0.9,
      eagerLoad: true,
      sections: [
        {
          id: 'entrance', label: 'Arrival',
          still: 'assets/stills/entrance.jpg',
          clip: 'assets/vid/entrance.mp4',
          accent: '#C9A24B',
          scroll: 1.6, linger: 0.4,
          // The brand mark appears burned into the door itself as it swings open
          // (door cracks ~t=0.8s, fully open ~t=2s of this 8s clip) and dissolves
          // before the camera passes through into the hallway.
          doorText: { text: 'CH+ Partners', from: 0.10, to: 0.30 },
          eyebrow: 'Hyderabad · Bespoke residential design',
          title: 'Brilliant design. Simplicity at scale.',
          body: 'Step into a home considered down to the last detail.',
          tags: ['Jali & brass', 'Makrana marble'],
        },
        {
          id: 'living', label: 'Living',
          still: 'assets/stills/living.jpg',
          clip: 'assets/vid/living.mp4',
          accent: '#C9A24B',
          eyebrow: 'The living room',
          title: 'Space that breathes.',
          body: 'Teak, brass and light, arranged with restraint.',
          tags: ['Teak joinery', 'Jharokha lighting'],
        },
        {
          id: 'kitchen', label: 'The Kitchen',
          still: 'assets/stills/kitchen.jpg',
          clip: 'assets/vid/kitchen.mp4',
          accent: '#C9A24B',
          scroll: 1.7, linger: 0.5,
          // No side-panel copy here on purpose — the payoff is the handwritten note
          // itself. Real, clickable text is positioned to sit exactly where the
          // video's baked-in handwriting is (measured against the rendered clip),
          // so it reads as one continuous object rather than a cut to a "web page."
          noteOverlay: {
            from: 0.78,
            title: "Let's design yours.",
            links: [
              { label: 'Email us', href: 'mailto:hello@chpluspartners.com' },
              { label: 'WhatsApp us', href: 'https://wa.me/919908916178' },
            ],
          },
        },
      ],
      connectors: [],
    });
  </script>
</body>
</html>
